# URL Management Service Configuration
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: url-management-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/urlservice}
      database: ${MONGODB_DATABASE:urlservice}
      auto-index-creation: true
      
    # Redis Configuration
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 30
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
      database: 0

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 15000
    requested-heartbeat: 30
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        multiplier: 10
        max-interval: 10000
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
          max-interval: 10000

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 86400000 # 24 hours
      cache-null-values: false
      key-prefix: "url-service:"
      use-key-prefix: true

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
      accept-single-value-as-array: true
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC

  # Validation Configuration
  validation:
    enabled: true

# Management and Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    mongo:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: url-management-service
    export:
      prometheus:
        enabled: true
        step: 30s
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s

# Logging Configuration
logging:
  level:
    root: INFO
    ai.shreds: DEBUG
    org.springframework.data: INFO
    org.springframework.amqp: INFO
    org.mongodb.driver: WARN
    io.lettuce: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/url-service.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
      clean-history-on-start: true

# Application Specific Configuration
url:
  shortening:
    algorithm: base62
    minLength: 6
    maxLength: 10
    charset: "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
    collision-retry-attempts: 5
  
  validation:
    enabled: true
    timeout: 30s
    retry-attempts: 3
    security-score-threshold: 70
  
  cache:
    ttl: 86400 # 24 hours in seconds
    popular-urls-ttl: 604800 # 7 days for popular URLs
    preload-popular-count: 1000
  
  expiration:
    default-days: 365
    max-days: 1095 # 3 years
    cleanup-batch-size: 1000
    cleanup-interval: 3600 # 1 hour
  
  custom-alias:
    min-length: 4
    max-length: 32
    allowed-characters: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_"
    reservation-ttl: 300 # 5 minutes
  
  bulk:
    max-batch-size: 100
    processing-timeout: 300s
  
  qr-code:
    default-size: 300
    default-error-correction: M
    default-format: png
    cache-ttl: 2592000 # 30 days

# External Services Configuration
external:
  services:
    qr-code:
      url: ${QR_CODE_SERVICE_URL:http://localhost:8090}
      timeout: 10s
      retry:
        max-attempts: 3
        initial-interval: 1s
        multiplier: 2
    
    user-service:
      url: ${USER_SERVICE_URL:http://localhost:8091}
      timeout: 5s
      circuit-breaker:
        failure-threshold: 5
        reset-timeout: 30s
        half-open-requests: 3
    
    analytics-service:
      url: ${ANALYTICS_SERVICE_URL:http://localhost:8092}
      timeout: 3s
      async: true
    
    config-service:
      url: ${CONFIG_SERVICE_URL:http://localhost:8093}
      timeout: 5s
      cache-ttl: 300s
      circuit-breaker:
        failure-threshold: 3
        reset-timeout: 60s

# RabbitMQ Exchange and Queue Configuration
rabbitmq:
  exchanges:
    url-created: url.events.created
    url-updated: url.events.updated
    url-deleted: url.events.deleted
    bulk-operation: url.events.bulk
    validation-request: url.validation.request
  
  queues:
    validation-completed: url.validation.completed
    dead-letter: url.events.dlq
  
  routing-keys:
    url-created: url.created
    url-updated: url.updated
    url-deleted: url.deleted
    bulk-completed: bulk.completed
    validation-request: validation.request
    validation-completed: validation.completed

